app-id: org.purei.Play
runtime: org.kde.Platform
runtime-version: 6.9
sdk: org.kde.Sdk
command: Play
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --filesystem=home:ro
  - --filesystem=/mnt:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  - --device=all
  - --socket=pulseaudio
modules:
  - shared-modules/glu/glu-9.json
  - name: evdev
    config-opts:
      - --disable-static
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /lib/*.la
      - /share/man
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.6.tar.xz
        sha256: 73f215eccbd8233f414737ac06bca2687e67c44b97d2d7576091aa9718551110
        x-checker-data:
          type: anitya
          project-id: 20540
          stable-only: true
          url-template: https://www.freedesktop.org/software/libevdev/libevdev-$version.tar.xz
  - name: Play!
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    build-options:
      arch:
        aarch64:
          config-opts:
            - -DCMAKE_BUILD_TYPE=RelWithDebInfo
            - -DUSE_GLES=yes
    post-install:
      - |
        GIT_VERSION=$(git describe --always);
        GIT_DATE=$(git show -s --format=%cs);
        sed -i 's|<releases>|<releases>\n    <release date="'${GIT_DATE}'" version="'${GIT_VERSION}'"/>|' ${FLATPAK_DEST}/share/metainfo/org.purei.Play.metainfo.xml;
    sources:
      - type: git
        url: https://github.com/jpd002/Play-.git
        tag: 0.72
        commit: 8de4a71f5215ef38e357ac77a07948eb3424448f
        disable-shallow-clone: true
